[project]
name = "codesentry"
version = "0.1.0"
description = "AI Coding Agent — analyze, plan, and modify code repositories"
requires-python = ">=3.11,<4.0"
readme = "../README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
